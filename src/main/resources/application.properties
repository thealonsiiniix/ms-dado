spring.application.name=ms-dado
server.port=8082

spring.datasource.url=jdbc:h2:mem:dadodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=false

# Clave HS256 compartida con el servicio que emite los tokens (min. 32 caracteres).
# En uso real, definir la variable de entorno JWT_SECRET.
jwt.secret=${JWT_SECRET:cambia-esta-clave-secreta-de-al-menos-32-caracteres}